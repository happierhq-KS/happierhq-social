name: Publish due posts

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes; GitHub sometimes runs these a little late
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would post, post nothing)"
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post anything that's due
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
        run: node scripts/publish.js ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save what posted
        if: always()
        run: |
          git config user.name "happierhq-bot"
          git config user.email "happierhq-bot@users.noreply.github.com"
          git add queue/posted.json
          git diff --cached --quiet || (git commit -m "Posted log update" && git pull --rebase && git push)
